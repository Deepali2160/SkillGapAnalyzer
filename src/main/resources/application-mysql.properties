# Active when spring.profiles.active=mysql
#
# To use this profile:
#   1. Start a local MySQL server.
#   2. Run:  CREATE DATABASE skillgapdb;
#   3. Set MYSQL_USER / MYSQL_PASSWORD as environment variables (or edit
#      the defaults below directly for local testing only - never commit
#      real credentials).
#   4. Change spring.profiles.active=mysql in application.properties
#      (or run with: --spring.profiles.active=mysql)
#
# The same JPA entities/repositories work unchanged against both H2 and
# MySQL - only this file differs.

spring.datasource.url=jdbc:mysql://localhost:3306/skillgapdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# H2 console has no meaning under MySQL
spring.h2.console.enabled=false
