<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar">
    <a th:href="@{/}" class="brand">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="logoGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#6C5CE7"/>
                    <stop offset="1" stop-color="#4F8EF7"/>
                </linearGradient>
            </defs>
            <rect width="32" height="32" rx="9" fill="url(#logoGrad)"/>
            <path d="M8 20L13 15L17 18L24 10" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="24" cy="10" r="2.3" fill="white"/>
            <circle cx="8" cy="20" r="1.8" fill="white" fill-opacity="0.85"/>
        </svg>
        SkillGap Analyzer
    </a>

    <button class="nav-toggle" type="button" aria-label="Toggle menu">
        <span></span><span></span><span></span>
    </button>

    <div class="nav-links">
        <div class="nav-group">
            <a th:href="@{/}">Home</a>
            <a th:href="@{/#features}">Features</a>
            <a th:href="@{/#how-it-works}">How It Works</a>
            <span sec:authorize="isAuthenticated()">
                <a th:href="@{/dashboard}">Dashboard</a>
                <a th:href="@{/resume}">Resume</a>
                <a th:href="@{/skills}">My Skills</a>
                <a th:href="@{/analysis}">Analyze</a>
                <a th:href="@{/analysis/history}">History</a>
            </span>
        </div>
        <div class="nav-group">
            <span sec:authorize="isAuthenticated()">
                <a th:href="@{/logout}">Logout</a>
            </span>
            <span sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}">Login</a>
                <a th:href="@{/register}" class="nav-cta">Get Started</a>
            </span>
        </div>
    </div>
</nav>
</body>
</html>
