<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Analysis Detail — SkillGap Analyzer</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<div class="container wide">
    <a th:href="@{/analysis/history}" class="back-link">&larr; Back to History</a>

    <div class="match-hero">
        <div class="big-ring" th:style="'--pct:' + ${analysis.matchPercent}">
            <span th:text="${analysis.matchPercent} + '%'"></span>
        </div>
        <div>
            <h2 th:text="${analysis.targetRole}"></h2>
            <p th:text="'Analyzed on ' + ${analysis.analyzedAt}"></p>
        </div>
    </div>

    <h2>Missing Skills at the Time</h2>
    <div th:if="${#lists.isEmpty(analysis.missingSkills)}" class="empty-state">
        <p style="margin:0;">No missing skills were recorded for this analysis.</p>
    </div>
    <table class="skill-table" th:unless="${#lists.isEmpty(analysis.missingSkills)}">
        <thead>
        <tr><th>Skill</th><th>Market Demand %</th></tr>
        </thead>
        <tbody>
        <tr th:each="m : ${analysis.missingSkills}">
            <td th:text="${m.skillName}"></td>
            <td th:text="${m.demandPercent} + '%'"></td>
        </tr>
        </tbody>
    </table>

    <h2>Recommended Courses</h2>
    <div class="course-grid">
        <th:block th:each="entry : ${recommendations}">
            <div class="course-card" th:each="c : ${entry.value}">
                <span class="course-skill-tag" th:text="${entry.key}"></span>
                <h4 th:text="${c.courseName}"></h4>
                <div class="course-rating" th:text="'⭐ ' + ${c.rating}"></div>
                <div class="course-provider" th:text="${c.provider}"></div>
                <a th:href="${c.url}" target="_blank" class="course-link">Start Learning →</a>
            </div>
        </th:block>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
