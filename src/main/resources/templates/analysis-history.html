<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Analysis History — SkillGap Analyzer</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<div class="container wide">
    <h1>Your Analysis History</h1>

    <div th:if="${#lists.isEmpty(history)}" class="empty-state">
        <h3>Ready to discover your skill gap?</h3>
        <p>Choose a career role and start your first analysis.</p>
        <a th:href="@{/analysis}" class="btn btn-primary">Start Analysis</a>
    </div>

    <table class="skill-table" th:unless="${#lists.isEmpty(history)}">
        <thead>
        <tr><th>Role</th><th>Match Score</th><th>Missing Skills</th><th>Date</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="a : ${history}">
            <td th:text="${a.targetRole}"></td>
            <td><span class="badge badge-neutral" th:text="${a.matchPercent} + '%'"></span></td>
            <td th:text="${#lists.size(a.missingSkills)}"></td>
            <td th:text="${a.analyzedAt}"></td>
            <td><a th:href="@{'/analysis/history/' + ${a.id}}" class="btn-link btn-sm">View</a></td>
        </tr>
        </tbody>
    </table>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
