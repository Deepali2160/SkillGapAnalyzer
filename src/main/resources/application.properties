# ===== Server =====
server.port=8080

# ===== Active database profile =====
# "h2" (default) needs zero setup. Switch to "mysql" once you have a
# local MySQL server running - see application-mysql.properties.
spring.profiles.active=h2

# ===== JPA (shared by both DB profiles) =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== JWT =====
# In production this MUST be overridden via an environment variable,
# e.g.  JWT_SECRET=some-long-random-string
# Never commit a real secret to source control.
jwt.secret=${JWT_SECRET:dev-only-local-secret-change-me-before-any-real-deployment}
jwt.expiration-ms=86400000

# ===== File upload (resume) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===== Job market data source (Phase 10) =====
# "static" (default): uses the bundled 40-posting CSV dataset, always works.
# "live": tries LiveJobDataProvider first, falls back to static automatically
#         if the external source is unreachable/returns bad data.
app.jobdata.source=${JOBDATA_SOURCE:static}
app.jobdata.live-url=https://remoteok.com/api
app.jobdata.timeout-ms=5000
